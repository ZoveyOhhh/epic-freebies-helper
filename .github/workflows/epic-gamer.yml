name: Epic Awesome Gamer (Scheduled)

on:
  workflow_dispatch: # 手动触发
  schedule:
    # 每周四 UTC 15:20 运行一次（北京时间周四 23:20）
    # 该时间点放在 Epic 周免刷新之后，避免过早触发。
    - cron: '20 15 */2 * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  epic-gamer:
    runs-on: ubuntu-22.04
    # A single account run can take 15-20 minutes. Multi-account runs are
    # sequential, so scale the timeout with the number of accounts by setting
    # a repository variable JOB_TIMEOUT_MINUTES (Settings -> Secrets and
    # variables -> Actions -> Variables). Defaults to 60 minutes.
    timeout-minutes: ${{ fromJSON(vars.JOB_TIMEOUT_MINUTES || '60') }}

    # 默认不在主仓库自身执行定时任务；Fork 后的仓库会正常运行。
    if: github.repository != 'Ronchy2000/epic-freebies-helper'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxml2-dev libxslt-dev

      - name: Install dependencies
        run: uv sync

      - name: Validate hCaptcha protocol contract
        env:
          PYTHONPATH: app
        run: uv run python scripts/check_hcaptcha_contract.py

      # 增加 GITHUB_TOKEN 以降低 Camoufox 下载时的 403 频率限制。
      - name: Install Camoufox
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run camoufox fetch

      # ⚠️ 注释掉 Playwright 安装，避免在 Ubuntu 22.04 上可能引发的兼容性问题，且节省时间。
      # - name: Install Playwright Firefox fallback
      #   run: uv run playwright install firefox

      - name: Run Epic Awesome Gamer
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          EPIC_ACCOUNTS: ${{ secrets.EPIC_ACCOUNTS }}
          EPIC_TOTP_SECRET: ${{ secrets.EPIC_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WXPUSH_ENDPOINT: ${{ secrets.WXPUSH_ENDPOINT }}
          WXPUSH_TOKEN: ${{ secrets.WXPUSH_TOKEN }}
          WXPUSH_USERID: ${{ secrets.WXPUSH_USERID }}
          WXPUSH_TEMPLATE_ID: ${{ secrets.WXPUSH_TEMPLATE_ID }}
          WXPUSH_BASE_URL: ${{ secrets.WXPUSH_BASE_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL || secrets.GLM_MODEL }}
          CHALLENGE_CLASSIFIER_MODEL: ${{ vars.CHALLENGE_CLASSIFIER_MODEL || secrets.CHALLENGE_CLASSIFIER_MODEL }}
          IMAGE_CLASSIFIER_MODEL: ${{ vars.IMAGE_CLASSIFIER_MODEL || secrets.IMAGE_CLASSIFIER_MODEL }}
          SPATIAL_POINT_REASONER_MODEL: ${{ vars.SPATIAL_POINT_REASONER_MODEL || secrets.SPATIAL_POINT_REASONER_MODEL }}
          SPATIAL_PATH_REASONER_MODEL: ${{ vars.SPATIAL_PATH_REASONER_MODEL || secrets.SPATIAL_PATH_REASONER_MODEL }}
          BROWSER_BACKEND: auto
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
          HEADLESS: virtual
          DISABLE_BEZIER_TRAJECTORY: false
          # 在 Actions 中我们依靠 GitHub 的 cron 触发，所以关闭内部调度器
          ENABLE_APSCHEDULER: false
          MPLBACKEND: Agg
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: app
          # 增加渲染等待时间，防止网络慢导致页面没加载完就执行下一步
          WAIT_FOR_CHALLENGE_VIEW_TO_RENDER_MS: 8000
        run: |
          echo "🚀 启动定时领取任务（支持 Gemini/AiHubMix/GLM）..."
          
          # 💡 强制清理之前失败留下的脏数据和缓存
          echo "🧹 正在清理旧缓存和运行时文件..."
          rm -rf app/volumes/hcaptcha/.cache
          rm -rf app/volumes/hcaptcha/.challenge
          rm -rf app/volumes/hcaptcha/.captcha
          rm -rf app/volumes/runtime
          
          xvfb-run --auto-servernum --server-num=1 --server-args='-screen 0, 1920x1080x24' uv run app/deploy.py

      - name: Write success summary
        if: success()
        run: |
          if grep -Rqs -E \
            'unable to download any more free games|wait 24 hours before trying again|24-hour free-game limit detected' \
            app/volumes/logs/ app/volumes/runtime/ 2>/dev/null; then
            {
              echo "## Run stopped: Epic 24-hour limit"
              echo
              echo "Action 已正常结束，但本次领取未成功：Epic 已限制该账号继续领取免费游戏。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Run completed"
              echo
              echo "The workflow completed successfully."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write failure summary
        if: failure()
        run: |
          if grep -Rqs -E \
            'unable to download any more free games|wait 24 hours before trying again|free-game redemption rate limit detected' \
            app/volumes/logs/ app/volumes/runtime/ 2>/dev/null; then
            {
              echo "## Claim not completed: Epic 24-hour limit"
              echo
              echo "本次领取未成功：Epic 已限制该账号继续领取免费游戏。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Claim not completed"
              echo
              echo "本次领取未完成，不能视为领取成功。请检查错误日志。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload runtime artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-runtime-${{ github.run_id }}
          path: |
            app/volumes/runtime/
            app/volumes/hcaptcha/.challenge/
          include-hidden-files: true
          retention-days: 7

      - name: Upload log artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-logs-${{ github.run_id }}
          path: app/volumes/logs/
          retention-days: 7

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: epic-screenshots-${{ github.run_id }}
          path: app/volumes/screenshots/
          retention-days: 7
